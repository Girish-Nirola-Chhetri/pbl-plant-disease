name: Server CI

on:
  push:
    branches:
      - main
      - fix/batch-2-backend-hardening
    paths:
      - "plant disease detection server/server/**"
      - ".github/workflows/server-ci.yml"
  pull_request:
    paths:
      - "plant disease detection server/server/**"
      - ".github/workflows/server-ci.yml"

jobs:
  test-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plant disease detection server/server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: plant disease detection server/server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test
